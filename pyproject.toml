[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-cce-reproducibility"
version = "0.3.1"
description = "Policy-space CCE saved-data reproduction and bounded simulator demonstration"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = ["numpy==2.1.3", "scipy==1.15.3", "PyYAML==6.0.2", "pandas==2.2.3", "matplotlib==3.10.0"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
policy-cce-repro = "policy_cce_repro.cli:main"

[tool.setuptools.packages.find]
include = ["cmfg_cce*", "policy_cce_repro*"]

[tool.setuptools.package-data]
cmfg_cce = ["configs/*.yaml"]

[tool.setuptools.data-files]
"share/policy-cce-reproducibility/metadata" = ["metadata/*.json", "metadata/*.lock"]
"share/policy-cce-reproducibility/metadata/compatibility" = ["metadata/compatibility/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

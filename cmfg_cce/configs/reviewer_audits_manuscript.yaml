experiment: reviewer_audits_manuscript
run_budget_label: manuscript_holdout
env_version: core_v1

population:
  name: balanced
  capacity_range: [50.0, 200.0]
  c_base_range: [1.0, 5.0]
  c_setup_range: [5.0, 20.0]
  p_out_range: [0.05, 0.20]
  alpha_range: [0.1, 1.5]

orders:
  workload_range: [5, 50]
  due_date_range: [5, 30]

outside_pressure:
  mode: scalar_markov
  decay: 0.90
  shock_size_range: [0.05, 0.25]
  max_pressure: 0.60

policies:
  markup_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40]
  lead_time_grid: [0.55, 0.70, 0.85, 1.00]

mechanisms:
  - M1_price_first
  - M2_price_critical
  - M3_delivery_first
  - M4_delivery_critical

mechanism_defaults:
  reserve_price_multiplier: 1.75
  single_bidder_markup_cap: 0.20
  rho: 2.0
  gamma: 0.99
  beta_p: 0.6
  beta_l: 0.4

reviewer_audits:
  N_values: [4]
  policies_per_agent: [6]
  horizon: 60
  rollouts_initial: 10
  seeds: [0, 1]

reviewer_audit:
  train_results_path: outputs/pair_repair_paper/raw/cce_results_pair_repair.json
  train_solver: REPAIR-PAIR-SAD-CCE
  train_if_missing: false
  run_holdout: true
  run_budget_diagnostics: false
  holdout_seed_offset: 100000
  pair_samples: 20
  pointwise_beta: 1.96
  simultaneous_alpha: 0.05
  bootstrap_samples: 100
  entropy_tau: 1.0

solver:
  target_gap: 1.0
  rollouts_max: 100
  active_sampling: true
  workers: 8
  initial_support_size: 12
  max_support_size: 40
  support_add_batch_size: 8
  max_rounds: 4
  beam_width: 24
  pair:
    beta: 1.96
    n_min_pair_samples: 8
    active_rounds: 5
    top_constraints: 10
    top_pairs_per_constraint: 20
    batch_samples_per_pair: 4
    q_min: 1.0e-4
    use_common_random_numbers: true

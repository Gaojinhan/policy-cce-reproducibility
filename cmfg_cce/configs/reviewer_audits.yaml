experiment: reviewer_audits_smoke
run_budget_label: smoke
env_version: core_v1

population:
  name: balanced
  capacity_range: [50.0, 200.0]
  c_base_range: [1.0, 5.0]
  c_setup_range: [5.0, 20.0]
  p_out_range: [0.05, 0.20]
  alpha_range: [0.1, 1.5]

orders:
  workload_range: [5, 50]
  due_date_range: [5, 30]

outside_pressure:
  mode: scalar_markov
  decay: 0.90
  shock_size_range: [0.05, 0.25]
  max_pressure: 0.60

policies:
  markup_grid: [0.05, 0.10, 0.15, 0.20]
  lead_time_grid: [0.55, 0.70, 0.85, 1.00]

mechanisms:
  - M1_price_first

mechanism_defaults:
  reserve_price_multiplier: 1.75
  single_bidder_markup_cap: 0.20
  rho: 2.0
  gamma: 0.99
  beta_p: 0.6
  beta_l: 0.4

reviewer_audits:
  N_values: [3]
  policies_per_agent: [3]
  horizon: 5
  rollouts_initial: 2
  seeds: [0]

reviewer_audit:
  train_results_path: outputs/pair_repair_paper/raw/cce_results_pair_repair.json
  train_solver: REPAIR-PAIR-SAD-CCE
  train_if_missing: true
  run_holdout: true
  run_budget_diagnostics: true
  holdout_seed_offset: 100000
  pair_samples: 4
  pointwise_beta: 1.96
  simultaneous_alpha: 0.05
  bootstrap_samples: 50
  entropy_tau: 1.0
  random_extra_rollouts_max: 12
  best_pure_max_candidates: 8

solver:
  target_gap: 1.0
  rollouts_max: 4
  active_sampling: true
  workers: 2
  initial_support_size: 3
  max_support_size: 5
  support_add_batch_size: 1
  max_rounds: 1
  beam_width: 4
  vanilla_support_size: 4
  mwu_rounds: 4
  pair:
    beta: 1.96
    n_min_pair_samples: 2
    active_rounds: 1
    top_constraints: 2
    top_pairs_per_constraint: 3
    batch_samples_per_pair: 1
    q_min: 1.0e-4
    use_common_random_numbers: true
  repair:
    repair_rounds: 1
    top_constraints: 2
    top_profiles_per_constraint: 3
    q_min: 1.0e-4
    mean_threshold: 0.0
    contribution_min: 0.0
    enable_multi_agent_repair: true
    max_agents_repaired_per_profile: 2
    beam_width: 4
    profile_budget_multiplier: 1.5
    targeted_deviation_policies:
      M1_price_first: [P3]

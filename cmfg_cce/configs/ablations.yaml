experiment: ablations
run_budget_label: paper_run
env_version: core_v1

population:
  name: balanced
  capacity_range: [50.0, 200.0]
  c_base_range: [1.0, 5.0]
  c_setup_range: [5.0, 20.0]
  p_out_range: [0.05, 0.20]
  alpha_range: [0.1, 1.5]

orders:
  workload_range: [5, 50]
  due_date_range: [5, 30]

outside_pressure:
  mode: scalar_markov
  decay: 0.90
  shock_size_range: [0.05, 0.25]
  max_pressure: 0.60

policies:
  markup_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40]
  lead_time_grid: [0.55, 0.70, 0.85, 1.00]

mechanisms:
  - M3_delivery_first
  - M4_delivery_critical

mechanism_defaults:
  reserve_price_multiplier: 1.75
  single_bidder_markup_cap: 0.20
  rho: 2.0
  gamma: 0.99
  beta_p: 0.6
  beta_l: 0.4

ablations:
  N_values: [6]
  policies_per_agent: [8]
  horizon: 60
  rollouts_initial: 10
  seeds: [0, 1, 2, 3, 4]
  solvers: [SAD-CCE]

solver:
  target_gap: 1.0
  rollouts_max: 100
  active_sampling: true
  workers: 8
  initial_support_size: 10
  max_support_size: 32
  support_add_batch_size: 6
  max_rounds: 4
  vanilla_support_size: 20

variants:
  full_sad:
    solver: {}
  no_support_expansion:
    solver:
      max_rounds: 1
  low_initial_support:
    solver:
      initial_support_size: 5
      max_support_size: 18
  no_ucb_pressure:
    solver:
      target_gap: 0.0
  random_expansion_small_budget:
    solver:
      support_add_batch_size: 3
      max_support_size: 18

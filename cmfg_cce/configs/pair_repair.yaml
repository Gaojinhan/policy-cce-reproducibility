experiment: pair_repair_smoke
run_budget_label: pair_repair_smoke
env_version: core_v1

population:
  name: balanced
  capacity_range: [50.0, 200.0]
  c_base_range: [1.0, 5.0]
  c_setup_range: [5.0, 20.0]
  p_out_range: [0.05, 0.20]
  alpha_range: [0.1, 1.5]

orders:
  workload_range: [5, 50]
  due_date_range: [5, 30]

outside_pressure:
  mode: scalar_markov
  decay: 0.90
  shock_size_range: [0.05, 0.25]
  max_pressure: 0.60

policies:
  markup_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40]
  lead_time_grid: [0.55, 0.70, 0.85, 1.00]

mechanisms:
  - M1_price_first
  - M3_delivery_first

mechanism_defaults:
  reserve_price_multiplier: 1.75
  single_bidder_markup_cap: 0.20
  rho: 2.0
  gamma: 0.99
  beta_p: 0.6
  beta_l: 0.4

pair_repair:
  N_values: [4]
  policies_per_agent: [4]
  horizon: 20
  rollouts_initial: 4
  seeds: [0]
  solvers:
    - SAD-CCE
    - PAIR-SAD-CCE
    - REPAIR-SAD-CCE
    - REPAIR-PAIR-SAD-CCE
    - CG-CCE
    - MWU-PolicyTrace
    - RegretMatching-PolicyTrace

solver:
  target_gap: 1.0
  rollouts_max: 12
  active_sampling: true
  workers: 4
  initial_support_size: 6
  max_support_size: 12
  support_add_batch_size: 3
  max_rounds: 2
  beam_width: 8
  mwu_rounds: 8
  regret_matching_rounds: 8
  pair:
    beta: 1.96
    n_min_pair_samples: 2
    active_rounds: 1
    top_constraints: 3
    top_pairs_per_constraint: 4
    batch_samples_per_pair: 1
    q_min: 1.0e-4
  repair:
    repair_rounds: 2
    top_constraints: 3
    top_profiles_per_constraint: 6
    q_min: 1.0e-4
    mean_threshold: 0.5
    contribution_min: 0.0
    enable_multi_agent_repair: true
    max_agents_repaired_per_profile: 2
    beam_width: 8
    profile_budget_multiplier: 2.0
    targeted_deviation_policies:
      M1_price_first: [P3]
      M3_delivery_first: [D1, D3]
